var OL=0x59673a,DK=0x2e3322,BRS=0xc28a3d,GR=0x8a8576;
function lathe(p,c){return new THREE.Mesh(new THREE.LatheGeometry(p.map(function(a){return new THREE.Vector2(a[0],a[1])}),40),M(c,.6,.35))}
function missile(len,r,c){var g=new THREE.Group(),b=lathe([[0,0],[r,0],[r,len*.7],[r*.6,len*.92],[0,len]],c);g.add(b);for(var i=0;i<4;i++){var fn=bx(.02,r*1.6,r*1.4,GR,0,r*.8,0);fn.position.y=r*.9;var w=new THREE.Group();w.add(fn);fn.position.x=r*1.1;w.rotation.y=i*Math.PI/2;g.add(w)}g.rotation.z=-Math.PI/2;var o=new THREE.Group();o.add(g);return o}
function build(d){var g=new THREE.Group(),m=d.m,i,j;
if(m=='spg'){var hl=d.hl;g.add(bx(hl,.9,2.6,OL,0,.9,0));g.add(bx(hl+.5,1,.7,DK,0,.55,1.5));g.add(bx(hl+.5,1,.7,DK,0,.55,-1.5));g.add(bx(d.tl,d.flat?.9:1.2,2.2,OL,-.3,d.flat?1.85:2.05,0));g.add(cy(.17,.17,d.bl,GR,-.3+d.tl/2+d.bl/2-.2,d.flat?1.95:2.15,0,Math.PI/2));g.add(cy(.26,.26,.5,BRS,-.3+d.tl/2+d.bl-.2,d.flat?1.95:2.15,0,Math.PI/2))}
else if(m=='shell'){var p=[[0,0],[.78,0],[.8,.1],[.8,2.6],[.74,3.3],[.55,4.1],[.3,4.6],[.1,4.8],[0,4.82]];var b=lathe(p,0x59673a);g.add(b);var br=new THREE.Mesh(new THREE.TorusGeometry(.82,.09,16,48),M(BRS,.9,.22));br.rotation.x=Math.PI/2;br.position.y=.55;g.add(br);var fz=cy(.06,.22,.5,0xd9d2bf,0,4.75,0);g.add(fz);if(d.fins)for(i=0;i<4;i++){var w=new THREE.Group(),fn=bx(.9,.7,.04,BRS,.9,3.5,0);w.add(fn);w.rotation.y=i*Math.PI/2;g.add(w)}g.rotation.z=Math.PI/2*0+.3}
else if(m=='mlrs'){var L=d.L;g.add(bx(8,.6,2.4,DK,0,1,0));for(i=0;i<d.ax;i++)for(j=-1;j<=1;j+=2){var wl=cy(.7,.7,.5,0x15140f,3-i*(6.2/(d.ax-1)),.7,j*1.3,0,Math.PI/2);g.add(wl)}g.add(bx(1.7,1.6,2.3,OL,3.5,2.1,0));var pod=new THREE.Group(),s=d.r*2.4;pod.add(bx(L+.2,d.rows*s+.3,d.cols*s+.3,DK,0,(d.rows-1)*s/2,0));for(i=0;i<d.rows;i++)for(j=0;j<d.cols;j++){var t=cy(d.r,d.r,L,GR,0,i*s,(j-(d.cols-1)/2)*s,Math.PI/2);pod.add(t)}pod.position.set(-.8,1.6,0);pod.rotation.z=.55;g.add(pod)}
else if(m=='isk'){g.add(bx(9,.6,2.4,DK,0,1,0));for(i=0;i<4;i++)for(j=-1;j<=1;j+=2)g.add(cy(.7,.7,.5,0x15140f,3.6-i*2.4,.7,j*1.3,0,Math.PI/2));g.add(bx(1.7,1.6,2.3,OL,4,2.1,0));g.add(bx(6.2,.2,2.2,0x44503a,-1,2.9,0));for(j=-1;j<=1;j+=2){var ms=missile(6.4,.46,0xd9d2c0);ms.position.set(-3.6,1.9,j*.6);ms.rotation.z=.12;g.add(ms)}}
else if(m=='lancet'){var fu=missile(2.4,.17,0xe2dccb);fu.rotation.z=0;g.add(fu);for(i=0;i<2;i++){var wg=bx(.5,.03,3.4,0xe2dccb,.35,0,0);wg.rotation.x=Math.PI/4+i*Math.PI/2;g.add(wg);var tl=bx(.35,.03,1.3,0xe2dccb,-.9,0,0);tl.rotation.x=Math.PI/4+i*Math.PI/2;g.add(tl)}var pr=bx(.03,1,.08,0x222222,-1.25,0,0);g.add(pr);g.add(cy(.12,.12,.2,GR,.1,0,0,Math.PI/2))}
var bb=new THREE.Box3().setFromObject(g),sz=bb.getSize(new THREE.Vector3()),ct=bb.getCenter(new THREE.Vector3());g.position.sub(ct);var o=new THREE.Group();o.add(g);var sc=6.4/Math.max(sz.x,sz.y,sz.z);o.scale.set(sc,sc,sc);if(m=='shell')o.rotation.z=.0;return o}
function mount(i){if(!ok)return;var d=S[i];var st=els[i].querySelector('.st');if(!st||!d.model)return;st.insertBefore(cv,st.firstChild);var key=JSON.stringify(d.model);if(!models[key])models[key]=build(d.model);if(piv)Sc.remove(piv);piv=models[key];Sc.add(piv);ry=m0(d.model);rs()}
function m0(m){return m.m=='shell'?0:-.6}
if(ok){try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});Sc=new THREE.Scene();C=new THREE.PerspectiveCamera(32,1,.1,100);C.position.set(0,2.6,12);C.lookAt(0,0,0);Sc.add(new THREE.AmbientLight(0xfff1d6,.55));var k=new THREE.DirectionalLight(0xffe2ae,1.4);k.position.set(5,7,6);Sc.add(k);var fl=new THREE.DirectionalLight(0x8fa065,.5);fl.position.set(-6,-1,3);Sc.add(fl);var rm=new THREE.DirectionalLight(0xd4a24c,.9);rm.position.set(-3,4,-6);Sc.add(rm);
cv.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointerup',function(){drag=false});cv.addEventListener('pointermove',function(e){if(drag){ry+=(e.clientX-px)*.01;px=e.clientX}});
(function lp(){requestAnimationFrame(lp);if(piv){if(!drag)ry+=.006;piv.rotation.y=ry;if(S[cur].model&&S[cur].model.m=='shell'){piv.rotation.z=.3}else{piv.rotation.z=0}R.render(Sc,C)}})()}catch(e){ok=false}}
function rs(){if(!ok||!cv.parentNode)return;var w=cv.parentNode.clientWidth,h=cv.parentNode.clientHeight;if(!w||!h)return;R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}
addEventListener('resize',rs);
function go(n){n=Math.max(0,Math.min(S.length-1,n));cur=n;els.forEach(function(e,i){e.classList.toggle('on',i==n);e.classList.toggle('past',i<n)});document.querySelector('#pg i').style.width=((n+1)/S.length*100)+'%';document.getElementById('ct').textContent=String(n+1).padStart(2,'0')+' / '+S.length;try{history.replaceState(null,'','#s'+(n+1))}catch(e){}setTimeout(function(){mount(n)},40)}
document.getElementById('pv').onclick=function(){go(cur-1)};document.getElementById('nx').onclick=function(){go(cur+1)};
document.getElementById('fs').onclick=function(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
addEventListener('keydown',function(e){if(e.key=='ArrowRight'||e.key==' '||e.key=='PageDown'){e.preventDefault();go(cur+1)}else if(e.key=='ArrowLeft'||e.key=='PageUp'){go(cur-1)}else if(e.key=='Home'){go(0)}else if(e.key=='End'){go(S.length-1)}else if(e.key=='f'||e.key=='F'||e.key=='а'||e.key=='А'){document.getElementById('fs').click()}});
var tx=0;addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70&&!drag)go(cur+(d<0?1:-1))},{passive:true});
var h=parseInt((location.hash||'').replace('#s',''),10);go(h>0?h-1:0);
})();
